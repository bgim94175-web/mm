

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신고 콘솔</title>
<link rel="manifest" href="/report/manifest.json">
<link rel="apple-touch-icon" href="/report/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신고">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,sans-serif;background:#111;color:#eee;padding:16px 16px 32px}
h1{font-size:17px;margin:0 0 12px}
h2{font-size:14px;margin:22px 0 6px;color:#9ab}
label{display:block;font-size:12px;color:#999;margin:12px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#1b1b1b;color:#eee;font-size:16px}
button{padding:14px;border-radius:10px;border:0;background:#2a2a2a;color:#eee;font-size:15px;font-weight:600}
button.p{background:#3b6ef5}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
pre{margin-top:16px;padding:12px;border-radius:10px;background:#1b1b1b;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:56px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1}
.card{border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:16px}
.me{font-size:12px;color:#888;word-break:break-all}
.hide{display:none}
.list{margin-top:8px;max-height:280px;overflow-y:auto;border:1px solid #2a2a2a;border-radius:10px}
.item{padding:10px 12px;border-bottom:1px solid #222;cursor:pointer;font-size:13px}
.item:last-child{border-bottom:0}
.item:active{background:#223}
.item .t{font-weight:600;color:#9ab}
.item .s{color:#888;font-size:11px;margin-top:2px}
.item .m{color:#ccc;font-size:12px;margin-top:3px;word-break:break-all}
</style>


<h1>오픈채팅 신고 콘솔</h1>

<div id="login">
  <div class="card">
    <label>API 키</label>
    <input id="k" placeholder="SENDER_REPORT_API_KEY" autocomplete="off">
    <label>카카오 아이디</label>
    <input id="email" autocomplete="username" placeholder="example@kakao.com">
    <label>비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label>기기 유형</label>
    <select id="dt"><option value="tablet">tablet</option><option value="pc">pc</option></select>
    <div class="row"><button class="p" onclick="doLogin()">로그인</button></div>
    <div id="passBox" class="hide">
      <pre id="codeBox" class="hide"></pre>
      <label>인증번호 (폰에 입력한 번호)</label>
      <input id="code" inputmode="numeric">
      <div class="row"><button class="p" onclick="doPass()">확인</button></div>
    </div>
    <pre id="loginOut" class="hide"></pre>
  </div>
</div>

<div id="app" class="hide">
  <div class="card">
    <div class="me" id="me"></div>
    <div class="row"><button onclick="doLogout()">로그아웃</button><button onclick="refreshMe()">새로고침</button><button onclick="locoReconnect()">LOCO 재연결</button></div>
  </div>

  <h2>둘러보기 (자동 채우기)</h2>
  <div class="row"><button onclick="loadRooms()">방 목록 불러오기</button></div>
  <div id="roomList" class="list hide"></div>
  <div id="msgList" class="list hide"></div>

  <label>대상 userId</label>
  <input id="uid" inputmode="numeric" placeholder="숫자만 — 메시지 클릭 시 자동">
  <label>주입할 문장 (선택)</label>
  <input id="txt" placeholder="비우면 기본 문장">

  <h2>프로필 신고</h2>
  <div class="g">
    <button onclick="go('status')">상태</button>
    <button onclick="go('host')">호스트</button>
    <button onclick="go('slugs')">사유 12종</button>
    <button class="p" onclick="go('fire')">프로필 발사</button>
  </div>

  <h2>메시지 신고</h2>
  <label>방 번호 c</label>
  <input id="c" inputmode="numeric" placeholder="숫자만">
  <label>로그 번호 l (쉼표로 여러 개)</label>
  <input id="l" inputmode="numeric" placeholder="예: 123,456">
  <label>메서드 (비우면 발사 때 BLSPAMS, 시험은 후보 전부)</label>
  <input id="mth" placeholder="BLSPAMS · LBLSPAMS · OREPORT · REPORT ...">
  <div class="g">
    <button onclick="go('msg')">메서드 찾기</button>
    <button class="p" onclick="go('msgfire')">메시지 발사</button>
  </div>

  <h2>raw LOCO (운영자 전용)</h2>
  <label>method</label>
  <input id="rawM" placeholder="PING · CHATINFO · WRITE ...">
  <label>body (JSON — __long:["chatId","logId"] 로 Long 감싸기)</label>
  <input id="rawB" placeholder='{"__long":["chatId"],"chatId":"123"}'>
  <div class="row"><button onclick="raw()">raw 전송</button></div>

  <pre id="out">대기</pre>
  <div class="row"><button onclick="share()">결과 공유</button><button onclick="copy()">복사</button></div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const st = JSON.parse(localStorage.getItem('rp5') || '{}')
$('k').value = st.k || ''; $('email').value = st.email || ''; $('uid').value = st.uid || ''; $('txt').value = st.txt || ''; $('c').value = st.c || ''; $('l').value = st.l || ''
$('mth').value = st.mth || ''; $('rawM').value = st.rawM || ''; $('rawB').value = st.rawB || ''
const save = () => localStorage.setItem('rp5', JSON.stringify({ k: $('k').value, email: $('email').value, uid: $('uid').value, txt: $('txt').value, c: $('c').value, l: $('l').value, mth: $('mth').value, rawM: $('rawM').value, rawB: $('rawB').value }))
const q = () => '?k=' + encodeURIComponent($('k').value)

async function post(path, body) {
  let r
  try { r = await fetch(path + q(), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }) }
  catch (e) { throw new Error('네트워크 오류: ' + (e && e.message ? e.message : e)) }
  const text = await r.text()
  if (!text) throw new Error('서버가 빈 응답 (HTTP ' + r.status + ')')
  try { return JSON.parse(text) }
  catch (e) { throw new Error('응답이 JSON 아님 (HTTP ' + r.status + '): ' + text.slice(0, 120)) }
}
function fmtLogin(j) {
  const base = j.message || (j.ok ? '성공' : '실패')
  const loco = j.loco === 'O' ? ' · LOCO O' : j.loco === 'X' ? ' · LOCO X (' + (j.locoError || '사유 없음') + ')' : ''
  return base + loco
}
async function doLogin() {
  save(); $('loginOut').classList.remove('hide'); $('loginOut').textContent = '로그인 중…'
  const email = $('email').value.trim(), pw = $('pw').value
  if (!email || !pw) { $('loginOut').textContent = '아이디·비번 필요'; return }
  try {
    const j = await post('/report/login', { email, password: pw, deviceType: $('dt').value })
    $('loginOut').textContent = fmtLogin(j)
    if (j.ok) return enter()
    if (j.needPasscode) {
      $('passBox').classList.remove('hide')
      if (j.showCode) { $('codeBox').classList.remove('hide'); $('codeBox').textContent = '폰 카카오톡에 입력할 인증번호\n→ ' + j.showCode }
    }
  } catch (e) { $('loginOut').textContent = '실패: ' + e.message }
}
async function doPass() {
  $('loginOut').textContent = '확인 중…'
  try {
    const j = await post('/report/passcode', { code: $('code').value.trim(), password: $('pw').value, deviceType: $('dt').value })
    $('loginOut').textContent = fmtLogin(j)
    if (j.ok) return enter()
  } catch (e) { $('loginOut').textContent = '실패: ' + e.message }
}
function enter() { $('login').classList.add('hide'); $('app').classList.remove('hide'); refreshMe() }
async function refreshMe() {
  try {
    const r = await fetch('/report/me' + q())
    const text = await r.text()
    const j = JSON.parse(text)
    if (!j.loggedIn) { $('login').classList.remove('hide'); $('app').classList.add('hide'); return }
    const loco = j.loco === 'O' ? '🟢' : '🔴' + (j.locoError ? ' ' + j.locoError : '')
    $('me').textContent = '로그인됨 · ' + j.email + ' · uid ' + j.userId + ' · LOCO ' + loco
  } catch (e) { $('me').textContent = '상태 조회 실패: ' + e.message }
}
async function locoReconnect() {
  $('me').textContent = 'LOCO 재연결 중…'
  try {
    const j = await post('/report/loco-reconnect', { deviceType: $('dt').value })
    if (!j.ok) $('me').textContent = 'LOCO 재연결 실패: ' + (j.message || '사유 없음')
    else refreshMe()
  } catch (e) { $('me').textContent = 'LOCO 재연결 실패: ' + e.message }
}
async function doLogout() {
  await post('/report/logout', {})
  $('app').classList.add('hide'); $('login').classList.remove('hide'); $('loginOut').classList.add('hide')
}
function lock(on) { document.querySelectorAll('.g button').forEach((b) => { b.disabled = on; b.style.opacity = on ? '0.4' : '' }) }
async function go(what) {
  save()
  const uid = $('uid').value.trim()
  if (what !== 'status' && !uid) { $('out').textContent = 'userId 필요'; return }
  const p = new URLSearchParams({ k: $('k').value, uid })
  if (what === 'fire' || what === 'msgfire') p.set('text', $('txt').value)
  if (what === 'msg' || what === 'msgfire') {
    if (!$('c').value.trim() || !$('l').value.trim()) { $('out').textContent = '방·로그 번호 필요'; return }
    p.set('c', $('c').value.trim()); p.set('l', $('l').value.trim())
    if (what === 'msgfire' && $('mth').value.trim()) p.set('method', $('mth').value.trim())
  }
  const t0 = Date.now()
  $('out').textContent = '요청 중…'
  lock(true)
  const tick = setInterval(() => { $('out').textContent = '요청 중… ' + ((Date.now() - t0) / 1000).toFixed(1) + 's' }, 200)
  try {
    const r = await fetch('/report/' + what + '?' + p)
    $('out').textContent = JSON.stringify(await r.json(), null, 1)
  } catch (e) { $('out').textContent = '실패: ' + e.message }
  finally { clearInterval(tick); lock(false) }
}
function esc(s) { return String(s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
async function loadRooms() {
  const box = $('roomList'); box.classList.remove('hide'); box.innerHTML = '<div class="item">불러오는 중…</div>'
  $('msgList').classList.add('hide'); $('msgList').innerHTML = ''
  try {
    const r = await fetch('/report/rooms' + q())
    const j = await r.json()
    if (!j.ok) { box.innerHTML = '<div class="item">실패: ' + esc(j.text || JSON.stringify(j)) + '</div>'; return }
    const rooms = Array.isArray(j.rooms) ? j.rooms : []
    if (!rooms.length) { box.innerHTML = '<div class="item">방 없음</div>'; return }
    box.innerHTML = rooms.map((rm) =>
      '<div class="item" onclick="loadMsgs(\'' + rm.chatId + '\')">' +
        '<div class="t">' + esc(rm.typeName) + ' · ' + rm.activeMembers + '명 · ' + esc(rm.members || '(이름없음)') + '</div>' +
        '<div class="s">chat_id ' + rm.chatId + (rm.linkId ? ' · link_id ' + rm.linkId : '') + '</div>' +
        '<div class="m">' + esc(rm.preview || '(글 없음)') + '</div>' +
      '</div>'
    ).join('')
  } catch (e) { box.innerHTML = '<div class="item">실패: ' + esc(e.message) + '</div>' }
}
async function loadMsgs(chatId) {
  $('c').value = chatId; save()
  const box = $('msgList'); box.classList.remove('hide'); box.innerHTML = '<div class="item">불러오는 중…</div>'
  try {
    const r = await fetch('/report/room-msgs?c=' + encodeURIComponent(chatId) + '&cnt=15&k=' + encodeURIComponent($('k').value))
    const j = await r.json()
    if (!j.ok) { box.innerHTML = '<div class="item">실패: ' + esc(j.text || JSON.stringify(j)) + '</div>'; return }
    const msgs = Array.isArray(j.messages) ? j.messages : []
    if (!msgs.length) { box.innerHTML = '<div class="item">메시지 없음</div>'; return }
    box.innerHTML = msgs.map((m) => {
      const when = m.sendAt ? new Date(m.sendAt * 1000).toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }) : ''
      return '<div class="item" onclick="pickMsg(\'' + chatId + '\',\'' + m.logId + '\',\'' + m.authorId + '\')">' +
        '<div class="t">' + esc(when) + ' · type ' + m.type + ' · author ' + m.authorId + '</div>' +
        '<div class="s">log_id ' + m.logId + '</div>' +
        '<div class="m">' + esc(m.message || '(빈 글)') + '</div>' +
      '</div>'
    }).join('')
  } catch (e) { box.innerHTML = '<div class="item">실패: ' + esc(e.message) + '</div>' }
}
function pickMsg(chatId, logId, authorId) {
  $('c').value = chatId; $('l').value = logId; $('uid').value = authorId; save()
  $('out').textContent = '자동 채움 완료 → c=' + chatId + ' · l=' + logId + ' · uid=' + authorId + '\n이제 [메서드 찾기] 를 눌러.'
}
async function raw() {
  save()
  const method = $('rawM').value.trim()
  if (!method) { $('out').textContent = 'method 필요'; return }
  let body = {}
  const bt = $('rawB').value.trim()
  if (bt) {
    try { body = JSON.parse(bt) }
    catch (e) { $('out').textContent = 'body JSON 아님: ' + e.message; return }
  }
  $('out').textContent = '요청 중…'
  try {
    const j = await post('/report/raw', { method, body })
    $('out').textContent = JSON.stringify(j, null, 1)
  } catch (e) { $('out').textContent = '실패: ' + e.message }
}
function share() {
  const t = $('out').textContent
  if (navigator.share) navigator.share({ title: '신고 결과', text: t }).catch(() => {})
  else copy()
}
function copy() { navigator.clipboard.writeText($('out').textContent) }

refreshMe()
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/report/sw.js')
</script>
